[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sartrace"
version = "0.3.0"
description = "Evidence-first Sentinel-1 backscatter change screening lab"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Prakash Chand Jain"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "rasterio>=1.3",
  "streamlit>=1.40",
  "plotly>=5.20",
  "folium>=0.16",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sartrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
